name: Review evidence
# Runs only on review/** branches. Builds the site, captures full-page and interaction
# evidence with real network access, and publishes it to a review-artifacts/** branch.
on:
  push:
    branches: ['review/**']
permissions:
  contents: write
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.review.config.ts
        continue-on-error: true
      - name: Publish evidence to review-artifacts branch
        run: |
          OUT_BRANCH="review-artifacts/${GITHUB_REF_NAME#review/}"
          cp -r review-out /tmp/review-out
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$OUT_BRANCH"
          git rm -rfq .
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/review-out/. .
          git add -A
          git commit -qm "Review evidence for ${GITHUB_SHA}"
          git push -f origin "$OUT_BRANCH"
