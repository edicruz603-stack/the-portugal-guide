- id: fact.sintra.monserrate.coordinates-a
  kind: coordinates
  value:
    lat: 38.791861
    lon: -9.419192
    dms: 38°47'30.70"N 9°25'9.09"W
  text: 38°47’30.70”N 9°25’9.09”W (visitor map; monument page gives 38°47’30”N 9°25’09”W)
  source: src.parques-de-sintra.visitor-map
  provenance: official-page-read
  observed_on: '2026-11-11'
  status: unresolved
  conflict_group: monserrate-coordinates
  note: 'Re-read 15 Nov 2026: the monument page and the How to get there page give 38°47′30″N 9°25′09″W directly after saying the park is on the road from the town centre to Colares (EN375). Visit Sintra (municipal tourism) gives 38°47′30.9″N 9°25′09.1″W, about 6 m away. Which physical point the value marks is not stated; kept unresolved with coordinates-b. The map marker uses this value.'
- id: fact.sintra.monserrate.coordinates-b
  kind: coordinates
  value:
    lat: 38.794032
    lon: -9.420948
    dms: 38°47'38.515"N 9°25'15.413"W
  text: 38°47’38.515”N 9°25’15.413”W (second, unlabelled value on the English monument page)
  source: src.parques-de-sintra.monserrate
  provenance: official-page-read
  observed_on: '2026-11-11'
  status: unresolved
  conflict_group: monserrate-coordinates
  note: 'About 285 m from coordinates-a. Re-read 15 Nov 2026 on the monument page: this value is listed with the advice that, because of road works, access through Colares is recommended. A secondary source (Wikipedia, "Monserrate Palace") places the palace building about 35 m from it. No source states what the point marks, so it is not modelled as a separate point; kept unresolved with coordinates-a.'
