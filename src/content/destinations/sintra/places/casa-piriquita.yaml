  food_card:
    title: Casa Piriquita
    paragraphs:
      - "**For:** the classic travesseiro and traditional queijadas. Founded in 1862, this is one of Sintra’s best-known historic pastry houses. Expect a busy counter at peak times."
      - "**Address:** Rua das Padarias 16, historic centre."
