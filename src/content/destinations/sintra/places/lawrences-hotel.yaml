    tag: Historic landmark · exterior
    title: Lawrence's Hotel
    text: Founded in 1764 and often described as one of the oldest hotels in the Iberian Peninsula. Its story is linked to literary Sintra and the long tradition of travellers staying in the hills. Admire the exterior from the public street; it remains a working hotel, so do not assume non-guests can enter private rooms or facilities.
