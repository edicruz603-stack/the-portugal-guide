    label: 01 / THE GRAND ROMANTIC DREAM
    title: Monserrate Palace & Park
    text: An exuberant 19th-century Romantic masterpiece, with exotic gardens, winding paths, fern-filled corners, waterfalls and architecture that blends several influences. This is the place to slow down and wander.
    links:
      - label: Official visitor information ↗
        href: https://www.parquesdesintra.pt/en/parks-monuments/park-and-palace-of-monserrate/
        external: true
    meta: Allow a generous half-day · Adult ticket currently €12 · Check restoration notices before visiting.
