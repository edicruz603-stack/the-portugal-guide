    title: Museu Anjos Teixeira
    text: Dedicated to sculptors Artur and Pedro Anjos Teixeira, father and son. Look for the studies, models and sculptural figures; the museum is housed in a former watermill by the Rio do Porto. A compact cultural visit away from the palace crowds. Check current opening days and hours before setting out.
