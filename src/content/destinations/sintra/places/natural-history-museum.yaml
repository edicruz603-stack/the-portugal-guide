    text: Fossils, minerals and natural-history collections in the historic centre. A particularly good rainy-day option or a family stop. The municipal cultural agenda lists exhibitions such as “Mordidas do Tempo”, exploring fossil teeth, through 3 January 2027. Confirm current opening hours and exhibition access.
