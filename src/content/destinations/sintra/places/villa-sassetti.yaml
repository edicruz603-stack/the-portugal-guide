  local:
    tag: Free access · garden trail
    title: Vila Sassetti
    text: A romantic garden and hillside path connecting the village with the upper mountain area. Look for terraces, stonework and planting rather than treating it as a quick shortcut. The climb is steep and includes steps; avoid it if you need step-free access or if conditions are slippery.
    links:
