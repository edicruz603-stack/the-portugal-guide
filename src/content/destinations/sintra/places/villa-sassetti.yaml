  romantic:
    label: 03 / A WALK THROUGH THE WOODS
    title: Vila Sassetti
    text: A terracotta, Lombard-inspired villa framed by a garden path, water features, rocks and woodland. The route links the historic centre with the upper mountain, but it is not a flat stroll.
    links:
      - label: Official visitor information ↗
